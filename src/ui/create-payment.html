<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Payment</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e;
    --green: #3fb950; --red: #f85149; --blue: #58a6ff;
    --gold: #d29922; --card-bg: #1c2128;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff; --surface: #f6f8fa; --border: #d0d7de;
      --text: #1f2328; --muted: #636c76;
      --green: #1a7f37; --red: #cf222e; --blue: #0969da;
      --gold: #9a6700; --card-bg: #ffffff;
    }
  }
  [data-theme="light"] {
    --bg: #ffffff; --surface: #f6f8fa; --border: #d0d7de;
    --text: #1f2328; --muted: #636c76;
    --green: #1a7f37; --red: #cf222e; --blue: #0969da;
    --gold: #9a6700; --card-bg: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 13px; line-height: 1.5; padding: 16px;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 15px; font-weight: 600; }
  .section { margin-bottom: 16px; }
  .section-title {
    font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em;
    margin-bottom: 10px;
  }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field.full { grid-column: 1 / -1; }
  label {
    font-size: 11px; font-weight: 600; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .optional { font-weight: 400; font-size: 10px; color: var(--muted); opacity: .7; }
  input, select {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 7px; color: var(--text);
    padding: 8px 10px; font-size: 13px; outline: none; width: 100%;
    transition: border-color .15s;
  }
  input::placeholder { color: var(--muted); }
  input:focus, select:focus { border-color: var(--blue); }
  input.error { border-color: var(--red); }
  select option { background: var(--surface); }
  .amount-row { display: grid; grid-template-columns: 1fr 90px; gap: 8px; }
  .submit-btn {
    width: 100%; padding: 10px; border-radius: 8px; border: none;
    background: var(--blue); color: #fff; font-size: 13px; font-weight: 600;
    cursor: pointer; margin-top: 4px; transition: opacity .15s;
  }
  .submit-btn:hover:not(:disabled) { opacity: .85; }
  .submit-btn:disabled { opacity: .5; cursor: default; }
  .error-msg {
    color: var(--red); font-size: 12px; margin-top: 10px;
    padding: 8px 12px; border: 1px solid color-mix(in srgb, var(--red) 30%, transparent);
    background: color-mix(in srgb, var(--red) 8%, transparent);
    border-radius: 7px; display: none;
  }
  /* Result panel */
  .result { display: none; }
  .result-hero {
    text-align: center; padding: 20px 16px;
    background: color-mix(in srgb, var(--green) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--green) 25%, transparent);
    border-radius: 10px; margin-bottom: 16px;
  }
  .result-icon { font-size: 32px; margin-bottom: 8px; }
  .result-title { font-size: 16px; font-weight: 700; color: var(--green); margin-bottom: 4px; }
  .result-sub { font-size: 12px; color: var(--muted); }
  .auth-link-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 12px;
  }
  .auth-link-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
  .auth-link {
    display: block; word-break: break-all; font-size: 12px;
    color: var(--blue); text-decoration: none;
  }
  .auth-link:hover { text-decoration: underline; }
  .open-btn {
    display: block; width: 100%; padding: 10px; border-radius: 8px; border: none;
    background: var(--green); color: #fff; font-size: 13px; font-weight: 600;
    cursor: pointer; text-align: center; text-decoration: none;
    margin-bottom: 10px; transition: opacity .15s;
  }
  .open-btn:hover { opacity: .85; }
  .pid-box {
    font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted);
    background: var(--bg); border: 1px solid var(--border); border-radius: 5px;
    padding: 6px 10px; cursor: pointer; user-select: all;
    transition: border-color .15s, color .15s;
  }
  .pid-box:hover { border-color: var(--blue); color: var(--text); }
  .pid-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .back-btn {
    background: none; border: 1px solid var(--border); border-radius: 7px;
    color: var(--muted); cursor: pointer; font-size: 12px; padding: 6px 12px;
    width: 100%; margin-top: 8px; transition: border-color .15s, color .15s;
  }
  .back-btn:hover { border-color: var(--blue); color: var(--blue); }
</style>
</head>
<body>

<div class="header">
  <h1>New Payment</h1>
</div>

<div id="form-panel">
  <form id="form" autocomplete="off">

    <div class="section">
      <div class="section-title">Bank</div>
      <div class="fields">
        <div class="field">
          <label>Country</label>
          <input name="country" id="country-input" type="text" required maxlength="2" placeholder="LT"
            style="text-transform:uppercase" oninput="onCountryInput(this)">
        </div>
        <div class="field">
          <label>Bank Name</label>
          <input name="bank_name" id="bank-name-input" type="text" required placeholder="e.g. Swedbank" list="bank-list">
          <datalist id="bank-list"></datalist>
          <div id="bank-load-status" style="font-size:10px;color:var(--muted);margin-top:3px;display:none"></div>
        </div>
        <div class="field">
          <label>Payment Type</label>
          <select name="payment_type">
            <option value="SEPA">SEPA</option>
            <option value="INST_SEPA">Instant SEPA</option>
            <option value="DOMESTIC">Domestic</option>
          </select>
        </div>
        <div class="field">
          <label>Account Type</label>
          <select name="psu_type">
            <option value="personal">Personal</option>
            <option value="business">Business</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Amount</div>
      <div class="field">
        <div class="amount-row">
          <input name="amount" type="number" step="0.01" min="0.01" required placeholder="0.00">
          <select name="currency">
            <option value="EUR">EUR</option>
            <option value="USD">USD</option>
            <option value="GBP">GBP</option>
            <option value="SEK">SEK</option>
            <option value="NOK">NOK</option>
            <option value="DKK">DKK</option>
            <option value="PLN">PLN</option>
            <option value="CZK">CZK</option>
            <option value="HUF">HUF</option>
          </select>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Recipient</div>
      <div class="fields">
        <div class="field full">
          <label>Recipient Name</label>
          <input name="creditor_name" type="text" required placeholder="Full name or company">
        </div>
        <div class="field full">
          <label>Recipient IBAN</label>
          <input name="creditor_iban" type="text" required placeholder="LT00 0000 0000 0000 0000">
        </div>
        <div class="field full">
          <label>Reference / Remittance Info <span class="optional">optional</span></label>
          <input name="remittance" type="text" placeholder="Invoice #, payment reference…">
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">From Account <span class="optional" style="text-transform:none;letter-spacing:0">optional</span></div>
      <div class="fields">
        <div class="field full" style="display:flex;gap:6px;align-items:flex-end">
          <div style="flex:1">
            <label>Session ID <span class="optional">to load your accounts</span></label>
            <input id="session-id-input" type="text" placeholder="Paste session_id…" style="font-family:ui-monospace,monospace;font-size:11px">
          </div>
          <button type="button" id="load-accounts-btn" onclick="loadAccounts()" style="height:34px;padding:0 12px;background:var(--surface);border:1px solid var(--border);border-radius:7px;color:var(--text);cursor:pointer;font-size:12px;white-space:nowrap;flex-shrink:0">Load ↓</button>
        </div>
        <div class="field full">
          <label>Your IBAN <span class="optional">leave blank — bank lets user pick</span></label>
          <select id="debtor-select" style="display:none" onchange="onDebtorSelect()">
            <option value="">— Bank lets user pick —</option>
          </select>
          <input name="debtor_iban" id="debtor-manual" type="text" placeholder="LT00 0000 0000 0000 0000">
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Advanced</div>
      <div class="fields">
        <div class="field full">
          <label>Redirect URL <span class="optional">after bank authorisation</span></label>
          <input name="redirect_url" type="text" value="{{REDIRECT_URL}}">
        </div>
        <div class="field">
          <label>Execution Date <span class="optional">optional</span></label>
          <input name="execution_date" type="date">
        </div>
      </div>
    </div>

    <div class="error-msg" id="error-msg"></div>
    <button type="submit" class="submit-btn" id="submit-btn">Initiate Payment →</button>
  </form>
</div>

<div class="result" id="result-panel">
  <div class="result-hero">
    <div class="result-icon">🔐</div>
    <div class="result-title">Payment Initiated</div>
    <div class="result-sub">Copy the URL below and open it in your browser to authorise</div>
  </div>
  <div class="auth-link-box">
    <div class="auth-link-label">Bank Authorisation URL — click to select, then Cmd+C / Ctrl+C</div>
    <input id="auth-url-text" type="text" readonly onclick="this.select()"
      style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--blue);padding:8px 10px;font-size:11px;font-family:ui-monospace,monospace;word-break:break-all;cursor:pointer;outline:none">
  </div>
  <div class="pid-label" style="margin-top:12px">Payment ID</div>
  <div class="pid-box" id="pid-box" title="Click to select"></div>
  <button class="back-btn" onclick="showForm()">← New Payment</button>
</div>

<script>
function reportSize() {
  try { window.parent.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/size-changed',
    params: { height: document.body.scrollHeight, width: document.body.scrollWidth } }, '*'); } catch(_) {}
}
new ResizeObserver(reportSize).observe(document.body);

let _callId = 10;
const _pending = {};
function callTool(name, args, cb) {
  const id = _callId++;
  _pending[id] = cb;
  try { window.parent.postMessage({ jsonrpc: '2.0', id, method: 'tools/call', params: { name, arguments: args } }, '*'); } catch(_) {}
}
function uuid() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function showForm() {
  document.getElementById('form-panel').style.display = '';
  document.getElementById('result-panel').style.display = 'none';
}
let _currentAuthUrl = null;
function showResult(authUrl, paymentId) {
  document.getElementById('form-panel').style.display = 'none';
  document.getElementById('result-panel').style.display = 'block';
  _currentAuthUrl = authUrl || null;
  document.getElementById('auth-url-text').value = authUrl || '—';
  document.getElementById('pid-box').textContent = paymentId || '—';
  // Best-effort open (works if sandbox allows popups)
  if (authUrl) { try { window.open(authUrl, '_blank', 'noopener'); } catch(_) {} }
}
function copyAuthUrl() {
  const inp = document.getElementById('auth-url-text');
  inp.select();
  try { document.execCommand('copy'); } catch(_) {}
  const btn = document.getElementById('copy-url-btn');
  if (btn) { const orig = btn.textContent; btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = orig, 1500); }
}

let _bankFetchCountry = null;
function onCountryInput(el) {
  el.value = el.value.toUpperCase();
  const country = el.value.trim();
  if (country.length !== 2 || country === _bankFetchCountry) return;
  _bankFetchCountry = country;
  const status = document.getElementById('bank-load-status');
  status.textContent = 'Loading banks…'; status.style.display = '';
  callTool('get_available_banks', { country, service: 'PIS' }, function(result, err) {
    if (err) { status.textContent = 'Error fetching banks'; _bankFetchCountry = null; return; }
    if (result?.isError) { status.textContent = result?.content?.[0]?.text || 'API error'; _bankFetchCountry = null; return; }
    try {
      const text = result?.content?.[0]?.text || '';
      const data = result?.structuredContent || (text ? JSON.parse(text) : null);
      const banks = Array.isArray(data) ? data : (data?.banks || data?.aspsps || []);
      const dl = document.getElementById('bank-list');
      dl.innerHTML = banks.map(b => {
        const name = typeof b === 'string' ? b : (b.name || b.full_name || '');
        return name ? `<option value="${name.replace(/"/g, '')}">` : '';
      }).join('');
      status.textContent = banks.length > 0 ? `${banks.length} banks` : `No PIS banks found for ${country}`;
      setTimeout(() => status.style.display = 'none', 2000);
    } catch(e) { status.textContent = 'Parse error: ' + e.message; _bankFetchCountry = null; }
  });
}

function loadAccounts() {
  const sid = document.getElementById('session-id-input').value.trim();
  if (!sid) return;
  const btn = document.getElementById('load-accounts-btn');
  btn.textContent = '…'; btn.disabled = true;
  callTool('list_accounts', { session_id: sid }, function(result, err) {
    btn.textContent = 'Load ↓'; btn.disabled = false;
    if (err || result?.isError) return;
    try {
      const text = result?.content?.[0]?.text || '';
      const data = result?.structuredContent || JSON.parse(text);
      const accounts = data?.accounts || [];
      if (!accounts.length) return;
      // Fetch details for each account to get IBAN
      const sel = document.getElementById('debtor-select');
      sel.innerHTML = '<option value="">— Bank lets user pick —</option><option value="__manual__">Manual entry…</option>';
      let fetched = 0;
      accounts.forEach(function(uid) {
        const uidStr = typeof uid === 'string' ? uid : uid.uid;
        callTool('get_account_details', { account_id: uidStr, session_id: sid }, function(r2, e2) {
          fetched++;
          if (!e2 && !r2?.isError) {
            try {
              const t2 = r2?.content?.[0]?.text || '';
              const d2 = r2?.structuredContent || JSON.parse(t2);
              const iban = d2?.iban || d2?.identification;
              if (iban) {
                const label = (d2?.name ? d2.name + ' · ' : '') + iban;
                const opt = document.createElement('option');
                opt.value = iban; opt.textContent = label;
                sel.insertBefore(opt, sel.querySelector('[value="__manual__"]'));
              }
            } catch(_) {}
          }
          if (fetched === accounts.length) {
            sel.style.display = '';
            document.getElementById('debtor-manual').style.display = 'none';
            document.getElementById('debtor-manual').name = '';
          }
        });
      });
    } catch(_) {}
  });
}

function onDebtorSelect() {
  const sel = document.getElementById('debtor-select');
  const manual = document.getElementById('debtor-manual');
  if (sel.value === '__manual__') {
    manual.style.display = ''; manual.name = 'debtor_iban';
  } else {
    manual.style.display = 'none'; manual.name = '';
  }
}

function validateIBAN(v) {
  const s = v.replace(/\s/g, '').toUpperCase();
  if (!/^[A-Z]{2}\d{2}[A-Z0-9]{1,30}$/.test(s)) return false;
  // Full mod-97 checksum verification
  const rearranged = s.slice(4) + s.slice(0, 4);
  const numeric = rearranged.split('').map(c => c >= 'A' ? (c.charCodeAt(0) - 55).toString() : c).join('');
  let remainder = 0;
  for (const ch of numeric) remainder = (remainder * 10 + parseInt(ch)) % 97;
  return remainder === 1;
}
function showFieldError(name, msg) {
  const el = document.querySelector(`[name="${name}"]`);
  if (el) { el.classList.add('error'); el.title = msg; }
}
function clearFieldErrors() {
  document.querySelectorAll('input.error').forEach(el => { el.classList.remove('error'); el.title = ''; });
}

document.getElementById('form').addEventListener('submit', function(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const g = k => (fd.get(k) || '').trim();

  const errEl = document.getElementById('error-msg');
  errEl.style.display = 'none';
  clearFieldErrors();

  // Validate
  const errors = [];
  if (!g('bank_name')) { errors.push('Bank name is required'); showFieldError('bank_name', 'Required'); }
  if (!/^[A-Za-z]{2}$/.test(g('country'))) { errors.push('Country must be a 2-letter code (e.g. LT, DE)'); showFieldError('country', '2-letter code required'); }
  const amt = parseFloat(g('amount'));
  if (!g('amount') || isNaN(amt) || amt <= 0) { errors.push('Amount must be greater than 0'); showFieldError('amount', 'Must be > 0'); }
  if (!g('creditor_name')) { errors.push('Recipient name is required'); showFieldError('creditor_name', 'Required'); }
  if (!g('creditor_iban')) { errors.push('Recipient IBAN is required'); showFieldError('creditor_iban', 'Required'); }
  else if (!validateIBAN(g('creditor_iban'))) { errors.push('Recipient IBAN format is invalid'); showFieldError('creditor_iban', 'Invalid IBAN format'); }
  const debtorSelEl = document.getElementById('debtor-select');
  const debtorManual = g('debtor_iban');
  const usingManualDebtor = debtorSelEl.style.display === 'none' || debtorSelEl.value === '__manual__';
  if (usingManualDebtor && debtorManual && !validateIBAN(debtorManual)) { errors.push('Your IBAN format is invalid'); showFieldError('debtor_iban', 'Invalid IBAN format'); }
  if (!g('redirect_url') || !g('redirect_url').startsWith('http')) { errors.push('Redirect URL must be a valid URL'); showFieldError('redirect_url', 'Valid URL required'); }

  if (errors.length) {
    errEl.textContent = errors[0];
    errEl.style.display = '';
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Initiating…';

  const args = {
    bank_name:     g('bank_name'),
    country:       g('country').toUpperCase(),
    state:         uuid(),
    redirect_url:  g('redirect_url') || '{{REDIRECT_URL}}',
    amount:        g('amount'),
    currency:      g('currency'),
    creditor_name: g('creditor_name'),
    creditor_iban: g('creditor_iban').replace(/\s/g, ''),
    payment_type:  g('payment_type'),
    psu_type:      g('psu_type'),
  };
  // Debtor IBAN — from dropdown if loaded, else from manual input
  const selEl = document.getElementById('debtor-select');
  const debtorIban = (selEl.style.display !== 'none' && selEl.value && selEl.value !== '__manual__')
    ? selEl.value
    : g('debtor_iban').replace(/\s/g, '');
  if (g('remittance'))     args.remittance     = g('remittance');
  if (debtorIban)          args.debtor_iban    = debtorIban;
  if (g('execution_date')) args.execution_date = g('execution_date');

  callTool('create_payment', args, (result, err) => {
    btn.disabled = false; btn.textContent = 'Initiate Payment →';
    if (err || result?.isError) {
      const raw = result?.content?.[0]?.text || err?.message || 'Payment initiation failed';
      // Strip verbose prefix like "Error: 422 Unprocessable Entity [CODE]: " → keep just the message
      const msg = raw.replace(/^Error:\s*\d+[^:]*\[[^\]]+\]:\s*/i, '').replace(/^Error:\s*/i, '');
      errEl.textContent = msg; errEl.style.display = '';
      return;
    }
    const text = result?.content?.[0]?.text || '';
    let authUrl = null, paymentId = null;
    try {
      const parsed = result?.structuredContent || JSON.parse(text);
      authUrl   = parsed.aspsp_redirect_url || parsed.auth_url || parsed.redirect_url || parsed.authorization_url || parsed.url;
      paymentId = parsed.payment_id || parsed.id;
    } catch {
      const match = text.match(/https?:\/\/\S+/);
      if (match) authUrl = match[0];
    }
    showResult(authUrl, paymentId);
  });
});

window.addEventListener('message', function(event) {
  const msg = event.data;
  if (!msg || typeof msg !== 'object') return;
  if (msg.jsonrpc === '2.0' && msg.id === 1 && 'result' in msg) {
    const hc = msg.result?.hostContext;
    if (hc?.theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
    try { window.parent.postMessage({ jsonrpc: '2.0', method: 'ui/notifications/initialized', params: {} }, '*'); } catch(_) {}
    return;
  }
  if (msg.jsonrpc === '2.0' && typeof msg.id === 'number' && msg.id >= 10 && _pending[msg.id]) {
    const cb = _pending[msg.id]; delete _pending[msg.id]; cb(msg.result, msg.error); return;
  }
});

try {
  window.parent.postMessage({
    jsonrpc: '2.0', id: 1, method: 'ui/initialize',
    params: { protocolVersion: '2026-01-26',
      appCapabilities: { availableDisplayModes: ['inline'] },
      appInfo: { name: 'create-payment', version: '1.0.0' } }
  }, '*');
} catch(_) {}
</script>
</body>
</html>
